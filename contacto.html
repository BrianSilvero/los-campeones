<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />

  <meta name="description" content="Contacto de Pizzería Los Campeones: Av. Montes de Oca 856, Barracas (CABA). Teléfonos, WhatsApp, mail, horarios y cómo llegar." />
  <link rel="canonical" href="https://www.pizzerialoscampeones.com/contacto.html" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pizzería Los Campeones" />
  <meta property="og:title" content="Contacto · Pizzería Los Campeones, Barracas" />
  <meta property="og:description" content="Contacto de Pizzería Los Campeones: Av. Montes de Oca 856, Barracas (CABA). Teléfonos, WhatsApp, mail, horarios y cómo llegar." />
  <meta property="og:url" content="https://www.pizzerialoscampeones.com/contacto.html" />
  <meta property="og:image" content="https://www.pizzerialoscampeones.com/img/og-image.jpg" />
  <meta property="og:locale" content="es_AR" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Carta", "item": "https://www.pizzerialoscampeones.com/"}, {"@type": "ListItem", "position": 2, "name": "Contacto", "item": "https://www.pizzerialoscampeones.com/contacto.html"}]}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Pinyon+Script&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <header class="sub-hero">
    <div class="embers" aria-hidden="true"></div>
    <p class="sub-script">Los Campeones</p>
    <h1 data-i18n="contactTitle"></h1>
    <div class="hero-filete" data-filete></div>
    <p data-i18n="contactLead"></p>
  </header>

  <main class="contact-main">
    <!-- Acciones rápidas -->
    <div class="quick-actions">
      <a class="qa" id="qa-call"><span class="qa-ico" data-icon="phone"></span><span data-i18n="callUs"></span></a>
      <a class="qa qa-wa" id="qa-wa" target="_blank" rel="noopener"><span class="qa-ico" data-icon="whatsapp"></span><span data-i18n="writeUs"></span></a>
      <a class="qa" id="qa-map" target="_blank" rel="noopener"><span class="qa-ico" data-icon="pin"></span><span data-i18n="howToGet"></span></a>
    </div>

    <div class="contact-grid">
      <section class="info-card c-where">
        <h2><span data-icon="pin"></span><span data-i18n="whereTitle"></span></h2>
        <p id="c-address"></p>
        <p class="c-note" data-i18n="noBranches"></p>
        <div class="map-wrap">
          <iframe id="c-map" title="Mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </section>

      <section class="info-card">
        <h2><span data-icon="clock"></span><span data-i18n="hoursTitle"></span></h2>
        <p data-i18n="hoursText"></p>
        <p class="closed" data-i18n="mondayClosed"></p>
        <div id="c-status" class="c-status"></div>
      </section>

      <section class="info-card">
        <h2><span data-icon="phone"></span><span data-i18n="phonesTitle"></span></h2>
        <ul class="c-list" id="c-phones"></ul>
      </section>

      <section class="info-card">
        <h2><span data-icon="mail"></span><span data-i18n="emailTitle"></span></h2>
        <p><a id="c-email" class="link"></a></p>
        <h2 class="c-sub"><span data-icon="whatsapp"></span>WhatsApp</h2>
        <p><a id="c-wa" class="link" target="_blank" rel="noopener"></a></p>
      </section>
    </div>

    <a href="reservar.html" class="access-card access-gold access-book c-book">
      <span class="access-ico" data-icon="calendar"></span>
      <span><b data-i18n="accessBook"></b><small data-i18n="accessBookSub"></small></span>
      <span class="access-arrow" data-icon="arrow"></span>
    </a>
  </main>

  <footer class="footer">
    <div data-filete class="footer-filete"></div>
    <img src="img/logo-negativo.png" alt="" class="footer-logo" />
    <p class="footer-note" data-i18n="footerNote"></p>
  </footer>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación"></nav>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
